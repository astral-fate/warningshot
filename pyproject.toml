[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "warningshot"
version = "1.0.0"
description = "Counting-dependence and null results in measuring attention to an AI incident"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Fatimah Emad Eldin", email = "Fatimah@trouve.works" }]
keywords = ["collective attention", "wikipedia pageviews", "AI incidents", "decay models"]

# scipy is used by core/regression.py (raw-scale NLS) and core/hawkesn.py (MLE);
# pyyaml by detect/corpus.py. Both were exercised by the test suite before they
# were declared here, which meant a clean `pip install .` could not run it.
dependencies = [
  "requests>=2.28",
  "numpy>=1.24",
  "scipy>=1.10",
  "matplotlib>=3.6",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
