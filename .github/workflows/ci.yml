name: CI

# The reproducibility claim is that a clean clone reproduces every number
# offline, with no credentials. That is only credible if something checks it on
# a machine that is not the author's, so this runs the same two commands the
# README tells a reader to run.

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Tests (no network)
        run: python -m pytest -q

      - name: Verify headline numbers against committed results
        run: python scripts/verify.py

      - name: Producers regenerate the results without fetching
        # Two separate invariants, and only the first is exact.
        #
        # Exact: re-running the producers must not add a cache entry. A fetch
        # means the committed cache no longer covers the analysis, and the
        # "$0, offline, no credentials" claim is already false.
        #
        # Tolerance-based: the regenerated numbers must still satisfy every
        # check in verify.py. Byte-equality is deliberately NOT required --
        # bootstrap resampling and np.percentile differ in the last digit
        # across numpy versions (CI runs 2.2/2.5 against the author's 2.4), so
        # demanding identical bytes would fail on a version bump while the
        # science was untouched. verify.py carries explicit tolerances; those
        # are the precision the paper actually claims, so those are what is
        # enforced here.
        run: |
          set -euo pipefail
          before=$(find cache -type f | wc -l)
          python scripts/power_and_comparators.py > /dev/null
          python scripts/nulls_and_controls.py    > /dev/null
          python scripts/robustness_suite.py      > /dev/null
          after=$(find cache -type f | wc -l)

          echo "cache entries before=$before after=$after"
          if [ "$before" != "$after" ]; then
            echo "::error::producers fetched new data; the committed cache no longer covers the analysis"
            git status --short cache/
            exit 1
          fi

          echo "--- re-verifying against the REGENERATED results ---"
          if ! python scripts/verify.py; then
            echo "::error::regenerated results no longer satisfy verify.py"
            exit 1
          fi

          if ! git diff --quiet -- results/; then
            echo "::notice::regenerated results differ from the committed bytes"
            echo "(expected on a different numpy/scipy build; all checks still pass)"
            git diff --stat -- results/
          fi
