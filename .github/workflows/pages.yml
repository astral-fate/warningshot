name: Deploy deck to GitHub Pages

# Publishes the pitch deck (index.html), the assets it references, and a PDF
# rendered from that same HTML. The deck has no build step of its own, so this
# copies it as-is and renders the PDF rather than running a site generator.
#
# One-time setup: Settings -> Pages -> Source: "GitHub Actions".
# On a private repository, Pages requires a paid plan; on a public one it is free.

on:
  push:
    branches: [main, master]
    paths:
      - 'index.html'
      - 'docs/**'
      - 'paper/main.pdf'
      - 'scripts/build_deck_pdf.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the deck's assets resolve
        run: |
          set -euo pipefail
          test -f index.html
          # every relative src/href in the deck must exist, or Pages 404s silently
          missing=0
          for ref in $(grep -oE '(src|href)="[^"#:]+"' index.html \
                       | sed -E 's/.*="([^"]+)"/\1/' \
                       | grep -vE '^(https?:|mailto:|#)' | sort -u); do
            if [ ! -e "$ref" ]; then echo "missing asset: $ref"; missing=1; fi
          done
          exit $missing

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Render the deck to PDF
        # Built here rather than trusted from the repository, so the published
        # PDF is always the current index.html and cannot go stale.
        run: |
          pip install playwright pypdf
          python -m playwright install --with-deps chromium
          python scripts/build_deck_pdf.py --out docs/deck.pdf

      - name: Assemble the site
        run: |
          mkdir -p _site/docs _site/paper
          cp index.html _site/
          cp docs/pipeline.svg docs/deck.pdf _site/docs/
          cp docs/deck.pdf _site/deck.pdf
          cp paper/main.pdf _site/paper/
          cp README.md _site/ 2>/dev/null || true
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
